apply plugin: 'com.android.application'
apply plugin: 'com.google.gms.google-services'   // Firebase Google Services plugin

android {
    namespace "com.archii.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.archii.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')

    // ── Firebase Dependencies ──
    // Firebase BoM (Bill of Materials) — manages compatible versions automatically
    implementation platform('com.google.firebase:firebase-bom:33.12.0')

    // Firebase Authentication (native Google/Microsoft/Apple sign-in)
    implementation 'com.google.firebase:firebase-auth'

    // Firebase Cloud Messaging (push notifications)
    implementation 'com.google.firebase:firebase-messaging'

    // Firebase Firestore (real-time database)
    implementation 'com.google.firebase:firebase-firestore'

    // Firebase Storage (file uploads)
    implementation 'com.google.firebase:firebase-storage'

    // ── Google Sign-In Dependencies ──
    // These are required at RUNTIME by @capacitor-firebase/authentication
    // but the plugin only includes them as "compileOnly" by default.
    // Without these, Google Sign-In crashes with ClassNotFoundException.
    implementation 'com.google.android.gms:play-services-auth:20.7.0'
    implementation 'androidx.credentials:credentials:1.2.0-rc01'
    implementation 'androidx.credentials:credentials-play-services-auth:1.2.0-rc01'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.0'
}

apply from: 'capacitor.build.gradle'
