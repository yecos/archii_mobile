name: Build Android APK

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  workflow_dispatch:  # Permite ejecutar manualmente desde GitHub

jobs:
  # ============================================================
  # Job 1: Calidad de código (lint, types, seguridad)
  # ============================================================
  code-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias npm
        run: npm install --legacy-peer-deps

      - name: Verificar TypeScript
        run: npx tsc --noEmit --pretty

      - name: Ejecutar ESLint
        run: npx next lint
        continue-on-error: true  # No bloquea el build por warnings de lint

      - name: Auditoria de seguridad npm
        run: npm audit --audit-level=high
        continue-on-error: true  # No bloquea el build por vulnerabilidades

      - name: Verificar secrets en el codigo
        run: |
          if git diff HEAD~1 --name-only 2>/dev/null | xargs grep -l -E '(ghp_|AIza|sk-|xoxb-|PK[0-9])' 2>/dev/null; then
            echo "::warning::Posibles secrets detectados en el diff"
          fi
        continue-on-error: true

  # ============================================================
  # Job 2: Build del APK (depende de que pase code-quality)
  # ============================================================
  build:
    needs: code-quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Configurar Java 21 (requerido por Capacitor 7)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar dependencias npm
        run: npm install --legacy-peer-deps

      - name: Crear archivo google-services.json
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json

      - name: Crear archivo .env.local
        run: echo '${{ secrets.ENV_LOCAL }}' > .env.local

      - name: Construir la web (Next.js static export via build-mobile.sh)
        run: bash scripts/build-mobile.sh

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Restaurar keystore de debug (SHA-1 fijo para Firebase)
        run: |
          # Restore the debug keystore from GitHub Secrets.
          # This ensures the SHA-1 fingerprint matches what's registered in Firebase Console.
          # SHA-1: C5:9D:1F:F2:18:28:0B:88:C2:47:28:37:DF:00:10:14:14:73:B8:36
          mkdir -p ~/.android
          echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > ~/.android/debug.keystore
          echo ""
          echo "=== SHA-1 FINGERPRINT (must match Firebase Console) ==="
          keytool -list -v -keystore ~/.android/debug.keystore -storepass ${{ secrets.DEBUG_KEYSTORE_PASSWORD }} -alias ${{ secrets.DEBUG_KEYSTORE_ALIAS }} 2>&1 | grep SHA1

      - name: Configurar signing para Gradle
        working-directory: android
        run: |
          # Configure debug signing with our fixed keystore
          cat >> app/signing.properties << EOF
          storeFile=$HOME/.android/debug.keystore
          storePassword=${{ secrets.DEBUG_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.DEBUG_KEYSTORE_ALIAS }}
          keyPassword=${{ secrets.DEBUG_KEYSTORE_KEY_PASSWORD }}
          EOF

      - name: Construir APK de debug
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Subir APK debug como artifact
        uses: actions/upload-artifact@v4
        with:
          name: archii-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
